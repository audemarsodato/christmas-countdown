<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Christman Countdown</title>
</head>
<body>
        <section class="container">
                <div class="countdown-label">
                        <p class="countdown-label__p red">Christmas <span class="green">Countdown</span></p>
                </div>
                <div class="countdown-timer">
                        <h1 class="countdown-timer__days green" id="days"></h1>
                        <h1 class="countdown-timer__hours red" id="hours"></h1>
                        <h1 class="countdown-timer__minutes green" id="minutes"></h1>
                        <h1 class="countdown-timer__seconds red" id="seconds"></h1>
                </div>
        </section>

        <audio id="bg-music">
        </audio>

        <script src="https://app.embed.im/snow.js" defer></script>
        <script src="script.js"></script>
</body>
</html>
